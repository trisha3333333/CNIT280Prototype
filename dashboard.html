<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<button onclick="logout()">Logout</button>

<h2>Families</h2>
<table id="familyTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Needs</th>
<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Volunteers</h2>
<table id="volunteerTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Skills</th>
<th>Availability</th>
</tr>
</thead>
<tbody></tbody>
</table>

<h2>Add Opportunity</h2>
<input type="text" id="oppTitle" placeholder="Opportunity Title">
<input type="text" id="oppKeyword" placeholder="Keyword (ex: tutoring)">
<button onclick="addOpportunity()">Add Opportunity</button>

<h2>Match Families</h2>
<button onclick="matchFamilies()">Run Matching</button>
<div id="matchResults"></div>

<script src="js/script.js"></script>
</body>
</html>
