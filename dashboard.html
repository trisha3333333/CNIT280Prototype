<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Dashboard - Whispering Hills</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Whispering Hills</h2>
        <p style="margin-top: 10px; font-size: 14px;">Employee Portal</p>
        <button onclick="logout()" class="btn-secondary" style="margin-top:20px;">Logout</button>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-main">

        <h1 style="margin-bottom:30px;">Employee Dashboard</h1>

        <!-- Families Card -->
        <div class="card">
            <h2>Registered Families</h2>

            <table id="familyTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Needs</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Volunteers Card -->
        <div class="card">
            <h2>Registered Volunteers</h2>

            <table id="volunteerTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Skills</th>
                        <th>Availability</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Add Opportunity Card -->
        <div class="card">
            <h2>Add Opportunity</h2>

            <input type="text" id="oppTitle" placeholder="Opportunity Title">
            <input type="text" id="oppKeyword" placeholder="Matching Keyword (e.g., tutoring)">

            <button onclick="addOpportunity()" class="btn-primary">
                Add Opportunity
            </button>
        </div>

        <!-- Matching Card -->
        <div class="card">
            <h2>Match Families to Opportunities</h2>

            <button onclick="matchFamilies()" class="btn-primary">
                Run Matching
            </button>

            <div id="matchResults" style="margin-top:15px;"></div>
        </div>

    </main>

</div>

<script src="js/script.js"></script>

</body>
</html>
