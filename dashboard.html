<body>

<div class="dashboard-layout">

<aside class="sidebar">
    <h2>Whispering Hills</h2>
    <button onclick="logout()" class="btn-secondary">Logout</button>
</aside>

<main class="dashboard-main">

<h1>Employee Dashboard</h1>

<div class="card">
<h2>Registered Families</h2>
<table id="familyTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Needs</th>
<th>Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h2>Registered Volunteers</h2>
<table id="volunteerTable">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Skills</th>
<th>Availability</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="card">
<h2>Add Opportunity</h2>
<input type="text" id="oppTitle" placeholder="Opportunity Title">
<input type="text" id="oppKeyword" placeholder="Matching Keyword">
<button onclick="addOpportunity()" class="btn-primary">Add</button>
</div>

<div class="card">
<h2>Matching Results</h2>
<button onclick="matchFamilies()" class="btn-primary">Run Matching</button>
<div id="matchResults"></div>
</div>

</main>
</div>

<script src="js/script.js"></script>
</body>
