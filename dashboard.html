<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-layout">

<aside class="sidebar">
    <h2>Whispering Hills</h2>
    <button onclick="logout()" class="btn-secondary">Logout</button>
</aside>

<main class="dashboard-main">

<h1>Employee Dashboard</h1>

<div class="card">
    <h2>Families</h2>
    <table id="familyTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Needs</th>
                <th>Newsletter</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h2>Volunteers</h2>
    <table id="volunteerTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Skills</th>
                <th>Availability</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="card">
    <h2>Add Opportunity</h2>
    <input type="text" id="oppTitle" placeholder="Opportunity Title">
    <input type="text" id="oppKeyword" placeholder="Matching Keyword">
    <button onclick="addOpportunity()" class="btn-primary">Add</button>
</div>

<div class="card">
    <h2>Match Families</h2>
    <button onclick="matchFamilies()" class="btn-primary">Run Matching</button>
    <div id="matchResults"></div>
</div>

<div class="card">
    <h2>Query Tool</h2>
    <input type="text" id="queryInput" placeholder="Search families by keyword">
    <button onclick="runQuery()" class="btn-primary">Search</button>
    <button onclick="generateContactList()" class="btn-secondary">Generate Contact List</button>
    <div id="queryResults"></div>
</div>

<div class="card">
    <h2>Pending Submissions</h2>
    <div id="pendingSubmissions"></div>
</div>

<div class="card">
    <h2>Send Weekly Newsletter</h2>
    <input type="text" id="newsletterTitle" placeholder="Newsletter Title">
    <textarea id="newsletterMessage" placeholder="Write newsletter message here" style="width:100%; height:120px; padding:10px; border-radius:6px; border:1px solid #ddd; margin-bottom:15px;"></textarea>
    <button onclick="sendNewsletter()" class="btn-primary">Send Newsletter</button>
    <div id="newsletterStatus" style="margin-top:15px;"></div>
</div>

</main>
</div>

<script src="js/script.js"></script>
</body>
</html>
