<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Family Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
    <button onclick="logout()" class="btn-secondary">Logout</button>

    <div class="card">
        <h2>Family Registration</h2>
        <form id="familyForm">
            <input type="text" id="familyName" placeholder="Name" required>
            <input type="email" id="familyEmail" placeholder="Email" required>
            <input type="text" id="familyPhone" placeholder="Phone" required>
            <input type="text" id="familyNeeds" placeholder="Needs / Interests" required>

            <label class="checkbox-row">
                <input type="checkbox" id="familySubscribed">
                Subscribe to weekly newsletter
            </label>

            <button type="submit" class="btn-primary">Submit</button>
        </form>
    </div>

    <div class="card">
        <h2>Available Opportunities</h2>
        <div id="allOpportunities"></div>
    </div>

    <div class="card">
        <h2>Matched Opportunities</h2>
        <div id="familyMatches"></div>
    </div>

    <div class="card">
        <h2>Weekly Newsletters</h2>
        <div id="newsletterSection"></div>
    </div>

    <div class="card">
        <h2>Urgent Alerts</h2>
        <div id="alertSection"></div>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
