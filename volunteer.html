<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Volunteer Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">
    <button onclick="logout()" class="btn-secondary">Logout</button>

    <div class="card">
        <h2>Volunteer Registration</h2>
        <form id="volunteerForm">
            <input type="text" id="volName" placeholder="Name" required>
            <input type="email" id="volEmail" placeholder="Email" required>
            <input type="text" id="volSkills" placeholder="Skills" required>
            <input type="text" id="volAvailability" placeholder="Availability" required>
            <button type="submit" class="btn-primary">Submit</button>
        </form>
    </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
